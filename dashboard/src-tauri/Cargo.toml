[package]
name = "memvault-dashboard"
version = "0.2.0"
description = "MemVault Dashboard — Memory management UI"
authors = ["MemVault"]
edition = "2021"

[lib]
name = "dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
memvault-core = { path = "../../crates/memvault-core" }
