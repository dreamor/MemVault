<svg xmlns="http://www.w3.org/2000/svg" width="168" height="112" viewBox="0 0 168 112" role="img" aria-label="MemVault — cute elephant memory vault mascot">
  <!-- Background: solid deep indigo to echo the vault's calm steadiness -->
  <rect x="0" y="0" width="168" height="112" rx="12" fill="#1E2A44"/>

  <!-- Vault floor: a gentle rounded base the mascot peeks over -->
  <rect x="20" y="96" width="128" height="8" rx="4" fill="#141C30"/>

  <!-- Body: main indigo mass merging into the head -->
  <ellipse cx="78" cy="74" rx="40" ry="30" fill="#4C6FA5"/>

  <!-- Head: one dominant rounded circle -->
  <circle cx="86" cy="52" r="34" fill="#4C6FA5"/>

  <!-- Ears: paired, visible at 32x32 (right slightly deeper same-family tone) -->
  <circle cx="52" cy="46" r="13" fill="#3D5A8C"/>
  <circle cx="120" cy="44" r="13" fill="#3D5A8C"/>

  <!-- Face / muzzle: ivory panel carries recognizability -->
  <ellipse cx="86" cy="60" rx="22" ry="17" fill="#ECEFF5"/>

  <!-- Trunk: short rounded hook, reads as elephant at small size -->
  <path d="M88 72 q10 3 8 10 q-1 4 -6 4" fill="none" stroke="#ECEFF5" stroke-width="6" stroke-linecap="round"/>

  <!-- Eyes: two simple dots, wide-set, no highlights -->
  <circle cx="75" cy="48" r="4" fill="#1E2A44"/>
  <circle cx="97" cy="48" r="4" fill="#1E2A44"/>

  <!-- Tiny mouth for a calm friendly expression -->
  <path d="M82 65 q4 4 8 0" fill="none" stroke="#1E2A44" stroke-width="2" stroke-linecap="round"/>

  <!-- Cheek dot / memory spark: ivory, reuses the two-IP-color rule -->
  <circle cx="70" cy="60" r="2.5" fill="#4C6FA5" opacity="0.85"/>
</svg>