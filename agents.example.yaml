# MemVault Agent Registry
# Place this file at ~/.memvault/agents.yaml
# Each agent connecting via MCP gets its own injection rules.
#
# Optional per agent: `inject_channel` picks the single canonical injection
# path — mcp (session_start), proxy (transparent auto-injection), or sync
# (generated instruction files). When set, the other channels skip automatic
# injection for that agent so the same memory is not delivered twice
# (docs/PAPER-INSPIRATIONS.md Feature F). Omit it to allow every channel.

agents:
  - id: claude-desktop
    agent_type: coding-assistant
    description: "Claude Desktop — daily coding assistant"
    # inject_channel: mcp   # uncomment to restrict to a single delivery path
    inject_rules:
      max_memories: 8
      token_budget: 1500
      priority_order: ["MUST", "REFERENCE"]
      namespace_filter: ["global", "project:*"]
      exclude_types: ["writing", "design"]
      # api_key: "sk-your-secret"  # Optional: when set, agents must provide matching key

  - id: claude-code
    agent_type: coding-assistant
    description: "Claude Code CLI assistant"
    inject_rules:
      max_memories: 8
      token_budget: 1500
      priority_order: ["MUST", "REFERENCE"]
      namespace_filter: ["global", "project:*"]
      exclude_types: ["writing"]

  - id: cursor-ide
    agent_type: code-ide
    description: "Cursor IDE inline assistant"
    inject_rules:
      max_memories: 6
      token_budget: 1200
      priority_order: ["MUST", "REFERENCE"]
      namespace_filter: ["global", "project:*"]
      exclude_types: []

  - id: deepseek-harness
    agent_type: coding-assistant
    description: "DeepSeek Harness (dsh) — DeepSeek's open-source Agent Harness, connected via MCP"
    inject_rules:
      max_memories: 8
      token_budget: 1500
      priority_order: ["MUST", "REFERENCE"]
      namespace_filter: ["global", "project:*"]
      exclude_types: ["writing"]

  - id: default
    agent_type: general-assistant
    description: "Default profile for unregistered agents"
    inject_rules:
      max_memories: 8
      token_budget: 1500
      priority_order: ["MUST", "REFERENCE"]
      namespace_filter: ["global"]
      exclude_types: []
