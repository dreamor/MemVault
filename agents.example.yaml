# MemVault Agent Registry
# Place this file at ~/.memvault/agents.yaml
# Each agent connecting via MCP gets its own injection rules.
#
# An agent_id with no matching entry here falls back to a built-in
# fingerprint (fuzzy-matched by id/client_info — see
# crates/memvault-core/src/agent_adapt.rs) when one exists, otherwise to the
# `default` profile below, whose `namespace_filter` is `["global"]` only —
# project-scoped memories are silently dropped. Give any host you rely on an
# explicit entry here so customizing it (api_key, exclude_types, etc.) is
# guaranteed to take effect instead of being shadowed by the fuzzy fallback.
#
# Optional per agent: `inject_channel` picks the single canonical injection
# path — mcp (session_start), proxy (transparent auto-injection), or sync
# (generated instruction files). When set, the other channels skip automatic
# injection for that agent so the same memory is not delivered twice
# (docs/DESIGN.md §17.5). Omit it to allow every channel.
#
# `description` and `inject_rules` are optional: missing values fall back to
# an empty description and the built-in InjectRules defaults (8 memories /
# 1500 tokens / global namespace), so a minimal id + agent_type entry is valid.

agents:
  - id: claude-desktop
    agent_type: coding-assistant
    description: "Claude Desktop — daily coding assistant"
    # inject_channel: mcp   # uncomment to restrict to a single delivery path
    # api_key: "sk-your-secret"  # Optional, sibling of inject_rules (not nested under it):
    #   when set, this agent_id must provide a matching key on every call.
    #   A call that presents it successfully is stamped `identity_verified`
    #   on the memories it writes (Memory.identity_verified) — used by the
    #   opt-in MUST corroboration gate (MEMVAULT_CORROBORATION_GATE, see
    #   README "Environment Variables") to tell a cryptographically vouched
    #   identity apart from a caller merely asserting this agent_id.
    inject_rules:
      max_memories: 8
      token_budget: 1500
      priority_order: ["MUST", "REFERENCE"]
      namespace_filter: ["global", "project:*"]
      exclude_types: ["writing", "design"]

  - id: claude-code
    agent_type: coding-assistant
