name: Rebuild Docker image (manual)

# Manual image rebuild without a full release. Use for build-metadata changes
# (e.g. new OCI labels like io.modelcontextprotocol.server.name) that must
# reach the registries without bumping any package version: the image content
# is whatever the checked-out ref is, so only re-tag a commit that already
# shipped. Full releases go through release.yml (tag-driven), which pushes the
# same v<version> tag plus :latest.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to re-tag (e.g. v0.4.4, or 0.4.4)"
        required: true
        type: string
      move_latest:
        description: "Also move :latest to this image — leave off when re-tagging an older release"
        required: false
        type: boolean
        default: false

jobs:
  docker:
    name: Rebuild and push ghcr image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # GHCR requires an all-lowercase repository path (see release.yml).
      - name: Lowercase image repo name
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # Image tags are always v<version>, exactly like release.yml. This
      # workflow used to default to a free-form tag ("0.3.0"), which is where
      # the registry's only bare tag — and the stray v0.4.1 image that no
      # release ever shipped — came from.
      - name: Normalize the image tag
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like v0.4.4 (got '${{ inputs.version }}')"
            exit 1
          fi
          GHCR_TAGS="${IMAGE_REPO}:v${VERSION}"
          HUB_TAGS="docker.io/dreamor/memvault:v${VERSION}"
          if [ "${{ inputs.move_latest }}" = "true" ]; then
            GHCR_TAGS="${GHCR_TAGS},${IMAGE_REPO}:latest"
            HUB_TAGS="${HUB_TAGS},docker.io/dreamor/memvault:latest"
          fi
          {
            echo "GHCR_TAGS<<__EOF__"
            echo "$GHCR_TAGS"
            echo "__EOF__"
            echo "HUB_TAGS<<__EOF__"
            echo "$HUB_TAGS"
            echo "__EOF__"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.GHCR_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Docker Hub mirror: no-ops until DOCKERHUB_* secrets exist. Note the
      # gate resolves secrets via a step output — workflow_dispatch rejects
      # `secrets` directly inside step-level `if:` (static parse, HTTP 422).
      - name: Check Docker Hub credentials
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push mirror to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.HUB_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
