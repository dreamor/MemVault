name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build release binaries (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p memvault-cli -p memvault-mcp -p memvault-proxy

      - name: Package
        run: |
          set -euo pipefail
          out="memvault-${{ matrix.target }}"
          mkdir -p "$out"
          for bin in memvault-cli memvault-mcp memvault-proxy; do
            cp "target/${{ matrix.target }}/release/$bin" "$out/"
          done
          cp README.md LICENSE "$out/" 2>/dev/null || true
          tar -czf "$out.${{ matrix.archive_ext }}" "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: memvault-${{ matrix.target }}
          path: memvault-${{ matrix.target }}.${{ matrix.archive_ext }}

  dashboard-web:
    name: Web dashboard (dist archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm ci
        working-directory: dashboard
        run: npm ci
      - name: Build
        working-directory: dashboard
        run: npm run build
      - name: Package dist
        working-directory: dashboard
        run: tar -czf "dist/memvault-dashboard-${{ github.ref_name }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: memvault-dashboard-web
          path: dashboard/dist/memvault-dashboard-*.tar.gz

  vscode-package:
    name: VS Code extension (.vsix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm ci
        working-directory: vscode-extension
        run: npm ci
      - name: Compile
        working-directory: vscode-extension
        run: npm run compile
      - name: Package
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce package --no-dependencies -o memvault-${{ github.ref_name }}.vsix
      # `vsce publish` (Marketplace) is a deliberate manual step — see docs/RELEASING.md.
      - uses: actions/upload-artifact@v7
        with:
          name: memvault-vscode-extension
          path: vscode-extension/*.vsix

  obsidian-package:
    name: Obsidian plugin (release assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm ci
        working-directory: obsidian-plugin
        run: npm ci
      - name: Build
        working-directory: obsidian-plugin
        run: npm run build
      - name: Zip plugin (convenience download only)
        working-directory: obsidian-plugin
        run: zip -j "memvault-obsidian-${{ github.ref_name }}.zip" out/main.js manifest.json styles.css 2>/dev/null || zip -j "memvault-obsidian-${{ github.ref_name }}.zip" out/main.js manifest.json
      # BRAT and the community-plugins installer fetch main.js/manifest.json/styles.css
      # as INDIVIDUAL release assets by exact filename — a zip does not satisfy either.
      # Stage the raw files separately so github-release can attach them unzipped.
      - name: Stage individual release assets
        working-directory: obsidian-plugin
        run: |
          mkdir -p release-assets
          cp out/main.js manifest.json release-assets/
          cp styles.css release-assets/ 2>/dev/null || true
      # Submitting to the obsidianmd/obsidian-releases community plugin list is a
      # deliberate manual PR — see docs/RELEASING.md.
      - uses: actions/upload-artifact@v7
        with:
          name: memvault-obsidian-plugin
          path: |
            obsidian-plugin/*.zip
            obsidian-plugin/release-assets/*

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Publish GitHub Release
    needs: [build-binaries, docker, dashboard-web, vscode-package, obsidian-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          find artifacts -name "*.vsix" -exec cp {} dist/ \;
          find artifacts -name "memvault-obsidian-*.zip" -exec cp {} dist/ \;
          find artifacts -path "*/release-assets/*" -type f -exec cp {} dist/ \;
          ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
