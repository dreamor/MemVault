name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build release binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install OpenSSL dev (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p memvault-cli -p memvault-mcp -p memvault-proxy

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="memvault-${{ matrix.target }}"
          mkdir -p "$out"
          for bin in memvault-cli memvault-mcp memvault-proxy; do
            cp "target/${{ matrix.target }}/release/$bin${{ matrix.bin_ext }}" "$out/"
          done
          cp README.md LICENSE "$out/"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            tar -a -cf "$out.zip" "$out"
          else
            tar -czf "$out.${{ matrix.archive_ext }}" "$out"
          fi
          sha256sum "$out.${{ matrix.archive_ext }}" > "$out.${{ matrix.archive_ext }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: memvault-${{ matrix.target }}
          path: |
            memvault-${{ matrix.target }}.${{ matrix.archive_ext }}
            memvault-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256

  dashboard-web:
    name: Web dashboard (dist archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm ci
        working-directory: dashboard
        run: npm ci
      - name: Build
        working-directory: dashboard
        run: npm run build
      # Write the tarball OUTSIDE dist/: packing `dist/` while creating the
      # archive inside it makes GNU tar fail with "file changed as we read it".
      - name: Package dist
        working-directory: dashboard
        run: tar -czf "memvault-dashboard-${{ github.ref_name }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: memvault-dashboard-web
          path: dashboard/memvault-dashboard-*.tar.gz

  obsidian-package:
    name: Obsidian plugin (release assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm ci
        working-directory: obsidian-plugin
        run: npm ci
      - name: Build
        working-directory: obsidian-plugin
        run: npm run build
      - name: Zip plugin (convenience download only)
        working-directory: obsidian-plugin
        run: zip -j "memvault-obsidian-${{ github.ref_name }}.zip" out/main.js manifest.json styles.css 2>/dev/null || zip -j "memvault-obsidian-${{ github.ref_name }}.zip" out/main.js manifest.json
      # BRAT and the community-plugins installer fetch main.js/manifest.json/styles.css
      # as INDIVIDUAL release assets by exact filename — a zip does not satisfy either.
      # Stage the raw files separately so github-release can attach them unzipped.
      - name: Stage individual release assets
        working-directory: obsidian-plugin
        run: |
          mkdir -p release-assets
          cp out/main.js manifest.json release-assets/
          cp styles.css release-assets/ 2>/dev/null || true
      # Submitting to the obsidianmd/obsidian-releases community plugin list is a
      # deliberate manual PR — see docs/RELEASING.md.
      - uses: actions/upload-artifact@v7
        with:
          name: memvault-obsidian-plugin
          path: |
            obsidian-plugin/*.zip
            obsidian-plugin/release-assets/*

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # GHCR requires an all-lowercase repository path; GITHUB_REPOSITORY
      # keeps the original casing ("dreamor/MemVault").
      - name: Lowercase image repo name
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.ref_name }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Publish GitHub Release
    needs: [build-binaries, docker, dashboard-web, obsidian-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          find artifacts -name "*.zip" -exec cp {} dist/ \;
          find artifacts -name "memvault-obsidian-*.zip" -exec cp {} dist/ \;
          find artifacts -path "*/release-assets/*" -type f -exec cp {} dist/ \;
          find artifacts -name "*.sha256" -exec cp {} dist/ \;
          ls -la dist
      - name: Generate SHA256SUMS
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
