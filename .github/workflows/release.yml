name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Dashboard tests
        working-directory: dashboard
        run: npm ci && npm test

      - name: DSH plugin tests
        working-directory: dsh-plugin
        run: npm ci && npm test

  build-binaries:
    name: Build release binaries (${{ matrix.target }})
    needs: [lint-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install OpenSSL dev (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p memvault-cli -p memvault-mcp -p memvault-proxy

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="memvault-${{ matrix.target }}"
          mkdir -p "$out"
          for bin in memvault-cli memvault-mcp memvault-proxy; do
            cp "target/${{ matrix.target }}/release/$bin${{ matrix.bin_ext }}" "$out/"
          done
          cp README.md LICENSE "$out/"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            tar -a -cf "$out.zip" "$out"
          else
            tar -czf "$out.${{ matrix.archive_ext }}" "$out"
          fi
          sha256sum "$out.${{ matrix.archive_ext }}" > "$out.${{ matrix.archive_ext }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: memvault-${{ matrix.target }}
          path: |
            memvault-${{ matrix.target }}.${{ matrix.archive_ext }}
            memvault-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256

  dashboard-web:
    name: Web dashboard (dist archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm ci
        working-directory: dashboard
        run: npm ci
      - name: Build
        working-directory: dashboard
        run: npm run build
      # Write the tarball OUTSIDE dist/: packing `dist/` while creating the
      # archive inside it makes GNU tar fail with "file changed as we read it".
      - name: Package dist
        working-directory: dashboard
        run: tar -czf "memvault-dashboard-${{ github.ref_name }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: memvault-dashboard-web
          path: dashboard/memvault-dashboard-*.tar.gz

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # secrets are surfaced as job env so the optional-mirror steps can test
    # them with `env.` — the `secrets` context is not allowed inside `if:`.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # GHCR requires an all-lowercase repository path; GITHUB_REPOSITORY
      # keeps the original casing ("dreamor/MemVault").
      - name: Lowercase image repo name
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.ref_name }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Docker Hub mirror (optional). Configure DOCKERHUB_USERNAME /
      # DOCKERHUB_TOKEN repo secrets to enable; without them these steps
      # no-op and the job stays green (GHCR remains the primary registry).
      - name: Login to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Push mirror to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            docker.io/dreamor/memvault:${{ github.ref_name }}
            docker.io/dreamor/memvault:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Publish GitHub Release
    needs: [build-binaries, docker, dashboard-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          find artifacts -name "*.zip" -exec cp {} dist/ \;
          find artifacts -name "*.sha256" -exec cp {} dist/ \;
          ls -la dist
      - name: Generate SHA256SUMS
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # crates.io (OIDC trusted publishing — no token secret needed)
  # ---------------------------------------------------------------------------
  publish-crates:
    name: Publish crates to crates.io
    needs: [github-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate via trusted publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish core first, then consumers
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          publish_with_retry() {
            local crate="$1" attempt=1 max_attempts=10
            until cargo publish -p "$crate" --allow-dirty --no-verify; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "cargo publish $crate failed after $max_attempts attempts" >&2
                exit 1
              fi
              echo "cargo publish $crate failed (attempt $attempt/$max_attempts) — retrying in 15s"
              attempt=$((attempt + 1))
              sleep 15
            done
          }
          for crate in memvault-core memvault-cli memvault-mcp memvault-proxy; do
            echo "==> cargo publish $crate"
            publish_with_retry "$crate"
          done

  # ---------------------------------------------------------------------------
  # npm — @dreamor/dsh-memvault (OIDC trusted publishing)
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish dsh plugin to npm
    needs: [github-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Sync package version with tag
        working-directory: dsh-plugin
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Bumping package.json version: $PKG_VERSION -> $TAG_VERSION"
            npm version "$TAG_VERSION" --no-git-tag-version
          fi
      - name: npm ci
        working-directory: dsh-plugin
        run: npm ci
      - name: Build
        working-directory: dsh-plugin
        run: npm run build
      - name: Test
        working-directory: dsh-plugin
        run: npm test
      - name: Publish
        working-directory: dsh-plugin
        run: |
          # First publish of a scoped package may need --access public
          # and must not use OIDC if the package doesn't exist yet.
          # Try with provenance first; fall back without if 404.
          npm publish --access public --provenance || npm publish --access public

  # ---------------------------------------------------------------------------
  # Homebrew tap (dreamor/homebrew-tap)
  # ---------------------------------------------------------------------------
  update-homebrew:
    name: Update Homebrew formula
    needs: [github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping Homebrew formula update"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi
      - name: Generate and push formula
        if: env.SKIP != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          REPO="dreamor/memvault"

          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/dreamor/homebrew-tap.git" /tmp/tap

          bash scripts/update-homebrew-formula.sh "$VERSION" > /tmp/tap/Formula/memvault.rb

          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/memvault.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged — nothing to push"
          else
            git commit -m "memvault ${VERSION#v}"
            git push
          fi
