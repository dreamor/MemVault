name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish-only:
        description: "Skip build, only run publish jobs (per-channel switches below)"
        required: false
        type: boolean
        default: false
      version:
        description: "Version to publish (e.g. v0.4.1), used with publish-only"
        required: false
        type: string
      publish-crates:
        description: "Publish crates.io"
        required: false
        type: boolean
        default: true
      publish-npm:
        description: "Publish npmjs (dsh plugin)"
        required: false
        type: boolean
        default: true
      publish-homebrew:
        description: "Update Homebrew formula"
        required: false
        type: boolean
        default: true
      publish-mcp:
        description: "Publish the MCP Registry listing"
        required: false
        type: boolean
        default: true
      publish-dockerhub:
        description: "Mirror the image to Docker Hub (needs the DOCKERHUB_* secrets; false skips the mirror on purpose)"
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: Lint & test
    if: ${{ !inputs.publish-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Dashboard tests
        working-directory: dashboard
        run: npm ci && npm test

      - name: DSH plugin tests
        working-directory: dsh-plugin
        run: npm ci && npm test

  verify-version:
    name: Verify the tag matches every shipped manifest
    if: ${{ !inputs.publish-only }}
    runs-on: ubuntu-latest
    # One tag, one version, everywhere: the tag must equal the Cargo workspace
    # version and every manifest that ships outside this repo (plugin bundles,
    # Gemini/Qoder/Hermes/pi manifests, npm dsh package + lock, the dashboard
    # package, the MCP registry listing and its ghcr image tag) as well as the
    # `--version` output documented in the READMEs. Without this gate a
    # half-bumped tree publishes a mixed-version release — the 0.4.2/0.4.3
    # cycle shipped `dashboard/package.json` at 0.4.0 that way, and v0.4.1
    # reached npm and a stray ghcr image without ever being tagged.
    steps:
      - uses: actions/checkout@v7
      - name: Check every manifest against the tag
        run: python3 scripts/check-release-versions.py "${{ inputs.version || github.ref_name }}"

  create-release:
    name: Create draft GitHub Release
    if: ${{ !inputs.publish-only }}
    needs: [verify-version, lint-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true

  build-binaries:
    name: Build release binaries (${{ matrix.target }})
    if: ${{ !inputs.publish-only }}
    needs: [lint-test, create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install OpenSSL dev (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p memvault-cli -p memvault-mcp -p memvault-proxy

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="memvault-${{ matrix.target }}"
          mkdir -p "$out"
          for bin in memvault-cli memvault-mcp memvault-proxy; do
            cp "target/${{ matrix.target }}/release/$bin${{ matrix.bin_ext }}" "$out/"
          done
          cp README.md LICENSE "$out/"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            tar -a -cf "$out.zip" "$out"
          else
            tar -czf "$out.${{ matrix.archive_ext }}" "$out"
          fi
          sha256sum "$out.${{ matrix.archive_ext }}" > "$out.${{ matrix.archive_ext }}.sha256"

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            memvault-${{ matrix.target }}.${{ matrix.archive_ext }}
            memvault-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256
          tag_name: ${{ github.ref_name }}
          # Keep the draft until every platform + SHA256SUMS is uploaded.
          draft: true

  dashboard-web:
    name: Web dashboard (dist archive)
    if: ${{ !inputs.publish-only }}
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm ci
        working-directory: dashboard
        run: npm ci
      - name: Build
        working-directory: dashboard
        run: npm run build
      # Write the tarball OUTSIDE dist/: packing `dist/` while creating the
      # archive inside it makes GNU tar fail with "file changed as we read it".
      - name: Package dist
        working-directory: dashboard
        run: tar -czf "memvault-dashboard-${{ github.ref_name }}.tar.gz" -C dist .
      - name: Upload dashboard to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dashboard/memvault-dashboard-*.tar.gz
          tag_name: ${{ github.ref_name }}
          draft: true

  docker:
    name: Build and push Docker image
    if: ${{ !inputs.publish-only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The Docker Hub mirror is a required channel by default: a missing
    # credential fails the job instead of turning into a silent green skip.
    # Opting out is explicit (`publish-dockerhub=false`). Secrets are surfaced
    # as job env because the `secrets` context is not allowed inside `if:`.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # An empty `inputs.*` on a tag push is NOT an opt-out — only an explicit
      # `publish-dockerhub: false` dispatch is.
      PUBLISH_DOCKERHUB: ${{ github.event_name != 'workflow_dispatch' || inputs.publish-dockerhub }}
    steps:
      - uses: actions/checkout@v7
      # GHCR requires an all-lowercase repository path; GITHUB_REPOSITORY
      # keeps the original casing ("dreamor/MemVault").
      - name: Lowercase image repo name
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # Image tags are always v<version>, matching the git tag — never a bare
      # `0.4.3` and never a branch name (a `workflow_dispatch` run on master
      # would otherwise publish `:master` and move `:latest` to an unreleased
      # build). Label-only rebuilds of an existing release go through
      # rebuild-docker.yml, which enforces the same shape.
      - name: Resolve the image tag
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release.yml must run on a v<major>.<minor>.<patch> tag (got '${{ inputs.version || github.ref_name }}'); use rebuild-docker.yml to rebuild an existing release"
            exit 1
          fi
          echo "IMAGE_TAG=v${VERSION}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Docker Hub mirror. GHCR stays the primary registry, but "the release
      # succeeded" must mean every channel we claim is live — so a missing
      # token is a hard, actionable error, not a warning nobody reads.
      - name: Require Docker Hub credentials
        if: env.PUBLISH_DOCKERHUB != 'false'
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_TOKEN:-}" ] || [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "::error::The Docker Hub mirror is enabled but DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set. Add the repo secrets, or re-run with publish-dockerhub=false to skip the mirror on purpose."
            exit 1
          fi
      - name: Login to Docker Hub
        if: env.PUBLISH_DOCKERHUB != 'false'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Push mirror to Docker Hub
        if: env.PUBLISH_DOCKERHUB != 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            docker.io/dreamor/memvault:${{ env.IMAGE_TAG }}
            docker.io/dreamor/memvault:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Publish GitHub Release
    if: ${{ !inputs.publish-only }}
    needs: [build-binaries, docker, dashboard-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Binaries and dashboard tarball were uploaded straight to the (draft)
      # release by build-binaries / dashboard-web. Here we only collect the
      # per-archive checksums, roll them into the cumulative SHA256SUMS the
      # installers verify against, upload it, then publish the draft.
      - name: Collect per-archive checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          # This job has no checkout — gh cannot infer the repo from a git
          # remote, so name it explicitly.
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --pattern '*.sha256' --dir dist
      - name: Generate SHA256SUMS
        run: |
          cat dist/*.sha256 | sort | tee dist/SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/SHA256SUMS
          tag_name: ${{ github.ref_name }}
          # Upload while still a draft; publishing happens in the step below
          # so a partial release is never publicly visible.
          draft: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false

  # ---------------------------------------------------------------------------
  # crates.io (OIDC trusted publishing — no token secret needed)
  # ---------------------------------------------------------------------------
  publish-crates:
    name: Publish crates to crates.io
    needs: [github-release]
    if: ${{ always() && (needs.github-release.result == 'success' || inputs.publish-only) && (github.event_name != 'workflow_dispatch' || inputs.publish-crates != false) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate via trusted publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish core first, then consumers
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          publish_with_retry() {
            local crate="$1" attempt=1 max_attempts=10 log
            if log=$(cargo publish -p "$crate" --allow-dirty --no-verify 2>&1); then
              echo "$log"
              return 0
            fi
            # Idempotent re-runs (publish-only after a partial release) hit
            # "already exists" — treat that as success instead of retrying 10x.
            if echo "$log" | grep -q "already exists on crates.io index"; then
              echo "::warning::crate $crate already published at this version — skipping"
              return 0
            fi
            until cargo publish -p "$crate" --allow-dirty --no-verify; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "cargo publish $crate failed after $max_attempts attempts" >&2
                exit 1
              fi
              echo "cargo publish $crate failed (attempt $attempt/$max_attempts) — retrying in 15s"
              attempt=$((attempt + 1))
              sleep 15
            done
          }
          for crate in memvault-core memvault-cli memvault-mcp memvault-proxy; do
            echo "==> cargo publish $crate"
            publish_with_retry "$crate"
          done

  # ---------------------------------------------------------------------------
  # npm — @dreamor/dsh-memvault (OIDC trusted publishing)
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish dsh plugin to npm
    needs: [github-release]
    if: ${{ always() && (needs.github-release.result == 'success' || inputs.publish-only) && (github.event_name != 'workflow_dispatch' || inputs.publish-npm != false) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Sync package version with tag
        working-directory: dsh-plugin
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          TAG_VERSION="${VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Bumping package.json version: $PKG_VERSION -> $TAG_VERSION"
            npm version "$TAG_VERSION" --no-git-tag-version
          fi
      - name: npm ci
        working-directory: dsh-plugin
        run: npm ci
      - name: Build
        working-directory: dsh-plugin
        run: npm run build
      - name: Test
        working-directory: dsh-plugin
        run: npm test
      - name: Publish
        working-directory: dsh-plugin
        run: npm publish --access public --provenance

  # ---------------------------------------------------------------------------
  # Homebrew tap (dreamor/homebrew-tap)
  # ---------------------------------------------------------------------------
  update-homebrew:
    name: Update Homebrew formula
    needs: [github-release]
    if: ${{ always() && (needs.github-release.result == 'success' || inputs.publish-only) && (github.event_name != 'workflow_dispatch' || inputs.publish-homebrew != false) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Explicit failure, not a warning: this job only runs when the tap is
      # wanted (`publish-homebrew` defaults to true), so a missing token means
      # the release would silently ship a stale formula.
      - name: Require the tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set, so the Homebrew formula cannot be updated. Add the repo secret (a token with Contents: write on dreamor/homebrew-tap), or re-run with publish-homebrew=false to skip the tap on purpose."
            exit 1
          fi
      - name: Generate and push formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          # In publish-only dispatches GITHUB_REF_NAME is the branch name —
          # the version must come from the input (same rule as publish-npm).
          VERSION="${{ inputs.version || github.ref_name }}"
          REPO="dreamor/MemVault"

          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/dreamor/homebrew-tap.git" /tmp/tap

          bash scripts/update-homebrew-formula.sh "$VERSION" > /tmp/tap/Formula/memvault.rb

          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/memvault.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged — nothing to push"
          else
            git commit -m "memvault ${VERSION#v}"
            git push
          fi

  # ---------------------------------------------------------------------------
  # MCP Registry listing (OIDC, no secrets). The publish logic lives in the
  # reusable workflow so the manual repair path (repoint / retire) stays one
  # file; this job is what removes the old "remember to re-publish by hand" step.
  # ---------------------------------------------------------------------------
  publish-mcp:
    name: Publish MCP Registry listing
    needs: [github-release]
    if: ${{ always() && (needs.github-release.result == 'success' || inputs.publish-only) && (github.event_name != 'workflow_dispatch' || inputs.publish-mcp) }}
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      # server.json advertises ghcr.io/dreamor/memvault:<tag>, so the image must
      # already be pushed — `github-release` waits on `docker`.
      version: ${{ inputs.version || github.ref_name }}

  # ---------------------------------------------------------------------------
  # Verify the bytes actually landed. The publish jobs above only *push*; this
  # job reads every public endpoint back and fails the run on any mismatch, so
  # "released" means "verified released" (see scripts/verify-release-channels.py
  # and the daily drift check in verify-release-drift.yml).
  # ---------------------------------------------------------------------------
  verify-release:
    name: Verify every release-locked channel serves the tag
    needs: [publish-crates, update-homebrew, publish-mcp]
    # Runs even when a channel was opted out (skipped), but not after a failure:
    # a failed publish already fails the run, and there is nothing to verify.
    if: ${{ always() && needs.publish-crates.result != 'failure' && needs.update-homebrew.result != 'failure' && needs.publish-mcp.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLISH_DOCKERHUB: ${{ github.event_name != 'workflow_dispatch' || inputs.publish-dockerhub }}
      PUBLISH_HOMEBREW: ${{ github.event_name != 'workflow_dispatch' || inputs.publish-homebrew }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify the live channels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ inputs.version || github.ref_name }}"
          args=(--attempts 6 --delay 20)
          if [ "$PUBLISH_DOCKERHUB" = "false" ]; then args+=(--skip dockerhub); fi
          if [ "$PUBLISH_HOMEBREW" = "false" ]; then args+=(--skip homebrew); fi
          python3 scripts/verify-release-channels.py "$version" "${args[@]}"
