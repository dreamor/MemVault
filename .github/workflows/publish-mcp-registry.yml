name: Publish MCP Registry listing

# The official MCP Registry listing (io.github.dreamor/memvault) authenticates
# with the workflow's GitHub OIDC token, so no long-lived secret is stored
# anywhere. The counterpart is that a laptop-side `mcp-publisher login github`
# JWT expires (observed live: 401 "token has invalid claims: token is
# expired"), which is why publishing from CI is the supported path.
#
# Trigger: release.yml calls this reusable workflow as its `publish-mcp` job, so
# a normal tag release publishes the listing with no human step. It is also
# callable by hand (Actions -> "Publish MCP Registry listing" -> Run workflow)
# for repairs: `repoint_version` rewrites a listing whose image tag still
# exists, `retire_version` marks one `deleted` when its image tag is gone.
# `server.json` is the source of truth for a normal publish.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag being published (informational; server.json is the source of truth)"
        required: false
        type: string
      repoint_version:
        description: "Repair mode: republish this older version with its image tag rewritten to v<version>. Fixes a listing whose image tag was deleted; leave blank for a normal release publish."
        required: false
        type: string
      retire_version:
        description: "Retire mode: mark this version as deleted (e.g. 0.3.0, whose ghcr image tag was removed). Run instead of a publish; leave blank otherwise."
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "Release tag to publish (server.json is the source of truth)"
        required: true
        type: string
      # Declared here too so the steps below can reference `inputs.*` unmodified
      # whether the run was dispatched by hand or called by release.yml.
      repoint_version:
        required: false
        type: string
        default: ""
      retire_version:
        required: false
        type: string
        default: ""

# Least privilege default; the mcp-registry job widens it with `id-token: write`.
permissions:
  contents: read

jobs:
  mcp-registry:
    name: Publish to the official MCP Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> registry.modelcontextprotocol.io
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Show what will be published
        if: inputs.retire_version == ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d = json.load(open("integrations/mcp-registry/server.json", encoding="utf-8"))
          print(f"name={d['name']} version={d['version']} image={d['packages'][0]['identifier']}")
          PY

      - name: Retire a listing whose image tag is gone (retire mode)
        if: inputs.retire_version != ''
        env:
          RETIRE: ${{ inputs.retire_version }}
        run: |
          set -euo pipefail
          ver="${RETIRE#v}"
          echo "Marking $ver as deleted in the registry…"
          ./mcp-publisher status \
            --status deleted \
            --message "Superseded; the ghcr image tag this listing referenced has been removed." \
            io.github.dreamor/memvault "$ver"

      - name: Repoint an older listing (repair mode)
        if: inputs.repoint_version != ''
        env:
          REPOINT: ${{ inputs.repoint_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import json, os
          ver = os.environ["REPOINT"].lstrip("v")
          p = "integrations/mcp-registry/server.json"
          d = json.load(open(p, encoding="utf-8"))
          d["version"] = ver
          d["packages"][0]["identifier"] = f"ghcr.io/dreamor/memvault:v{ver}"
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2)
          print(f"republishing {d['name']} {ver} -> {d['packages'][0]['identifier']}")
          PY2

      - name: Publish
        if: inputs.retire_version == ''
        run: ./mcp-publisher publish integrations/mcp-registry/server.json
