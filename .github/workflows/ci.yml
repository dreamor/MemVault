name: CI

# Two independent levels, so a master push can never look half-checked:
#
#   1. `paths:` below decides *whether* a push starts a run at all. It is
#      the deliberate cost control: a docs-only or CHANGELOG-only push
#      starts nothing (and `docs/**` is not listed).
#   2. Once a run exists on any trigger, it runs the *whole* matrix. No
#      job is gated on the event name, so a green master run means every
#      job is green — not one rust-core job next to skipped siblings.
#
# Consequence to keep in mind: on a docs-only push the newest master
# commit has no CI run at all (CodeQL still runs, it is not path-gated).
#
# `concurrency.cancel-in-progress` below means a burst of pushes cancels
# the older runs; the newest commit is the one whose result matters, and a
# cancelled run is not a failure.

on:
  push:
    branches: [main, master]
    paths:
      - 'crates/**'
      - 'dashboard/**'
      - 'obsidian-plugin/**'
      - 'dsh-plugin/**'
      - 'pi-extension/**'
      - 'package.json'
      - 'plugins/**'
      - 'integrations/**'
      - 'scripts/**'
      - 'commands/**'
      - '.claude-plugin/**'
      - '.agents/**'
      - 'agents.example.yaml'
      - 'gemini-extension.json'
      - 'plugin.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'crates/**'
      - 'dashboard/**'
      - 'obsidian-plugin/**'
      - 'dsh-plugin/**'
      - 'pi-extension/**'
      - 'package.json'
      - 'plugins/**'
      - 'integrations/**'
      - 'scripts/**'
      - 'commands/**'
      - '.claude-plugin/**'
      - '.agents/**'
      - 'agents.example.yaml'
      - 'gemini-extension.json'
      - 'plugin.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Least privilege for every job in this workflow: CI only ever reads the
# repository. Jobs that need more (none today) would widen it themselves.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Fast gate — fmt + clippy + unit test (~2 min)
  # ------------------------------------------------------------------
  rust-core:
    name: Rust core (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features -- --nocapture
      # Every channel's manifest must agree with the workspace version; drift
      # used to go unnoticed until a release (dashboard sat at 0.4.0 through
      # the 0.4.2/0.4.3 cycle). See scripts/check-release-versions.py.
      #
      # Branch pushes only, so an in-flight PR isn't blocked by drift it did
      # not introduce (the release gate in release.yml is what actually stops
      # a tag; a PR that lands drift is caught here as soon as it merges).
      - name: Version consistency
        if: github.event_name != 'pull_request'
        run: python3 scripts/check-release-versions.py

  # ------------------------------------------------------------------
  # Full matrix — every job below runs on pull requests *and* on
  # pushes to master. The push trigger above already narrows *which*
  # pushes start a run (code/manifest paths only), so once a run exists
  # its result is the whole picture: a green master means every job is
  # green, instead of a lone rust-core run next to skipped siblings.
  # ------------------------------------------------------------------
  license-check:
    # Name kept stable on purpose, though nothing actually pins it: there is no
    # branch protection here and the `main` ruleset is disabled (it only blocks
    # deletion / force-push), so a rename would not break a gate — it would
    # just churn the status-check name across past commits and PRs. The step
    # runs `licenses advisories`, so this is the advisory gate too.
    name: Dependency license check (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # advisories: fails the PR on any known RUSTSEC vulnerability in the
          # dependency graph — the gate `cargo audit` used to imply but no
          # workflow actually ran.
          command: check licenses advisories

  integration-smoke:
    name: REST API smoke test
    runs-on: ubuntu-latest
    needs: rust-core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release -p memvault-mcp -p memvault-cli
      - name: Start memvault-mcp (REST)
        run: |
          ./target/release/memvault-mcp --db /tmp/ci-smoke.db --transport http --port 18099 &
          echo $! > /tmp/mcp.pid
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:18099/health && break; sleep 0.5; done
      - name: Exercise REST endpoints
        run: |
          set -euo pipefail
          curl -sf -X POST http://127.0.0.1:18099/api/memories \
            -H "Content-Type: application/json" \
            -d '{"content":"ci smoke","priority":"MUST","agent_id":"ci"}' | grep -q '"ok":true'
          curl -sf -X POST http://127.0.0.1:18099/api/search \
            -H "Content-Type: application/json" \
            -d '{"query":"smoke"}' | grep -q '"ok":true'
          curl -sf http://127.0.0.1:18099/metrics | grep -q memvault_memories_saved_total
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/mcp.pid)" 2>/dev/null || true

  coverage:
    name: Coverage gate (cargo llvm-cov)
    runs-on: ubuntu-latest
    env:
      COVERAGE_FLAGS: --workspace --all-features --fail-under-lines 92 --fail-under-regions 90 --fail-under-functions 85
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov $COVERAGE_FLAGS || cargo llvm-cov $COVERAGE_FLAGS

  dashboard:
    name: Dashboard (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - name: Check embedded assets in sync
        run: |
          diff -r dashboard/dist crates/memvault-mcp/assets/web \
            || { echo "embedded assets drifted — run scripts/sync-dashboard-assets.sh"; exit 1; }

  obsidian-plugin:
    name: Obsidian plugin (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: obsidian-plugin
      - run: npm run build
        working-directory: obsidian-plugin
      - run: npm run typecheck
        working-directory: obsidian-plugin
      # Mirrors the community-directory automated review. An error here (notably
      # obsidianmd/no-unsupported-api) blocked v0.3.5 *after* release; fail first.
      - run: npm run lint
        working-directory: obsidian-plugin
      - run: npm test
        working-directory: obsidian-plugin

  pi-extension:
    name: pi extension (contract test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
        working-directory: pi-extension

  docker-smoke:
    name: Docker image (build + smoke)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: memvault:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker volume create memvault-ci-data >/dev/null
      - name: Verify binaries
        run: |
          set -euo pipefail
          for bin in memvault-cli memvault-mcp memvault-proxy; do
            docker run --rm --entrypoint sh memvault:ci -c "[ -x /usr/local/bin/$bin ]"
          done
      - name: Smoke CLI
        run: |
          set -euo pipefail
          img=memvault:ci
          docker run --rm -v memvault-ci-data:/home/memvault/.memvault "$img" \
            memvault-cli save --content "ci docker smoke" --priority MUST --agent-id ci
          # Capture first: `grep -q` exits at the first match and closes the
          # pipe, so the CLI's remaining stdout writes fail with EPIPE and
          # `pipefail` turns a passing smoke test into a red run.
          docker run --rm -v memvault-ci-data:/home/memvault/.memvault "$img" \
            memvault-cli list --limit 10 > /tmp/memvault-ci-list.txt
          grep -qi "ci docker smoke" /tmp/memvault-ci-list.txt

  agent-plugins:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax check
        run: |
          sh -n plugins/memvault/hooks/lib.sh
          sh -n plugins/memvault/hooks/session-start.sh
          sh -n plugins/memvault/hooks/session-extract.sh
          sh -n plugins/memvault/hooks/qoder-prompt.sh
          sh -n plugins/memvault/tests/run-tests.sh
          sh -n scripts/gen-rule-copies.sh
          sh -n scripts/check-rule-parity.sh
      - name: Plugin manifest lint
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          for rel in (".claude-plugin/marketplace.json",
                      ".agents/plugins/marketplace.json",
                      "plugins/memvault/.claude-plugin/plugin.json",
                      "plugins/memvault/mcp.json",
                      "plugins/memvault/hooks/hooks.json",
                      "gemini-extension.json",
                      "plugin.json"):
              json.load(open(rel, encoding="utf-8"))
          for rel in __import__("glob").glob("integrations/mcp-clients/*.json"):
              json.load(open(rel, encoding="utf-8"))
          for rel in __import__("glob").glob("commands/*.toml"):
              with open(rel, "rb") as f:
                  tomllib.load(f)
          # Codex 0.163.0-alpha.11.1 shows the decisive regression again:
          # with a portable Agent Plugins manifest at the plugin root,
          # Codex treats it as authoritative and does not enumerate
          # hooks/hooks.json, even when the manifest leaves `hooks`
          # unset. Claude Code reads .claude-plugin/plugin.json; do not
          # ship a plugin-root plugin.json.
          assert not os.path.exists("plugins/memvault/plugin.json"), \
              "remove plugins/memvault/plugin.json: its presence stops Codex hook discovery"
          assert os.path.isfile("plugins/memvault/.claude-plugin/plugin.json"), \
              "Claude-Code-compatible plugin manifest is required"
          assert os.path.isfile("plugins/memvault/hooks/hooks.json"), \
              "hooks/hooks.json must exist for Codex hook discovery"
          print("manifests ok")
          PY
      - run: sh plugins/memvault/tests/run-tests.sh
      - run: sh scripts/check-rule-parity.sh
      - run: node --check integrations/opencode/plugins/memvault.mjs
      - name: shellcheck (advisory)
        if: success() || failure()
        continue-on-error: true
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x plugins/memvault/hooks/*.sh plugins/memvault/tests/run-tests.sh scripts/check-rule-parity.sh scripts/gen-rule-copies.sh || true
          else
            echo "shellcheck not installed; skipped"
          fi
