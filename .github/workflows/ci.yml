name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'crates/**'
              - 'Dockerfile'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - '.github/workflows/ci.yml'

  rust-core:
    name: Rust core (test, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features -- --nocapture

  license-check:
    name: Dependency license check (cargo-deny)
    runs-on: ubuntu-latest
    needs: changes
    # Skip on trivial pushes (docs/dashboard-only changes); still runs
    # on manual dispatch so the license set can be checked on demand.
    if: needs.changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  integration-smoke:
    name: REST API smoke test (built binary)
    runs-on: ubuntu-latest
    needs: rust-core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release -p memvault-mcp -p memvault-cli
      - name: Start memvault-mcp (REST transport)
        run: |
          ./target/release/memvault-mcp --db /tmp/ci-smoke.db --transport http --port 18099 &
          echo $! > /tmp/mcp.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:18099/health && break
            sleep 0.5
          done
      - name: Exercise core REST endpoints
        run: |
          set -euo pipefail
          echo "-- save --"
          save_out=$(curl -sf -X POST http://127.0.0.1:18099/api/memories \
            -H "Content-Type: application/json" \
            -d '{"content":"ci smoke test memory","priority":"MUST","agent_id":"ci"}')
          echo "$save_out"
          echo "$save_out" | grep -q '"ok":true'

          echo "-- search --"
          curl -sf -X POST http://127.0.0.1:18099/api/search \
            -H "Content-Type: application/json" \
            -d '{"query":"smoke test"}' | grep -q '"ok":true'

          echo "-- session start --"
          curl -sf -X POST http://127.0.0.1:18099/api/session \
            -H "Content-Type: application/json" \
            -d '{"agent_id":"ci"}' | grep -q '"ok":true'

          echo "-- promote --"
          curl -sf -X POST http://127.0.0.1:18099/api/promote \
            -H "Content-Type: application/json" -d '{}' | grep -q '"ok":true'

          echo "-- metrics --"
          curl -sf http://127.0.0.1:18099/metrics | grep -q memvault_memories_saved_total

          echo "-- update memory (PUT) --"
          mem_id=$(echo "$save_out" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['id'])")
          curl -sf -X PUT "http://127.0.0.1:18099/api/memories/$mem_id" \
            -H "Content-Type: application/json" \
            -d '{"instruction":"ci updated instruction","priority":"MUST"}' | grep -q '"ok":true'
          echo "-- PUT with invalid priority rejected (400) --"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT "http://127.0.0.1:18099/api/memories/$mem_id" \
            -H "Content-Type: application/json" -d '{"priority":"MUSTT"}')
          [ "$code" = "400" ] || { echo "expected 400, got $code"; exit 1; }

          echo "-- inbox --"
          curl -sf http://127.0.0.1:18099/api/inbox | grep -q '"ok":true'

          echo "-- compliance --"
          curl -sf http://127.0.0.1:18099/api/compliance/summary | grep -q '"ok":true'

          echo "-- dedup --"
          curl -sf -X POST http://127.0.0.1:18099/api/dedup -H "Content-Type: application/json" -d '{}' | grep -q '"ok":true'

          echo "-- decay --"
          curl -sf -X POST http://127.0.0.1:18099/api/decay -H "Content-Type: application/json" -d '{}' | grep -q '"ok":true'
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/mcp.pid)" 2>/dev/null || true

  coverage:
    name: Coverage gate (cargo llvm-cov)
    runs-on: ubuntu-latest
    needs: changes
    # Skip on trivial pushes (docs/dashboard-only changes); still runs
    # on manual dispatch so coverage can be checked on demand.
    if: needs.changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch'
    env:
      COVERAGE_FLAGS: --workspace --all-features --fail-under-lines 92 --fail-under-regions 90 --fail-under-functions 85
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage gate
        run: |
          # fastembed downloads the ONNX Runtime shared lib during build
          # (ort-sys). The download is occasionally transient; retry once —
          # the compiled artifacts/ORT lib are cached in target/ so the
          # second attempt is fast and deterministically mirrors local runs.
          cargo llvm-cov $COVERAGE_FLAGS || cargo llvm-cov $COVERAGE_FLAGS

  dashboard:
    name: Dashboard (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm ci
        working-directory: dashboard
        run: npm ci
      - name: Frontend build (tsc + vite build)
        working-directory: dashboard
        run: npm run build
      - name: Frontend tests
        working-directory: dashboard
        run: npm test

  obsidian-plugin:
    name: Obsidian plugin (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm ci
        working-directory: obsidian-plugin
        run: npm ci
      - name: Build
        working-directory: obsidian-plugin
        run: npm run build
      - name: Typecheck
        working-directory: obsidian-plugin
        run: npm run typecheck
      - name: Test
        working-directory: obsidian-plugin
        run: npm test

  docker-smoke:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    needs: changes
    # Skip on trivial pushes (docs/dashboard-only changes); still runs
    # on manual dispatch so the image can be checked on demand.
    if: needs.changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (load for docker run)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: memvault:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create shared data volume
        run: docker volume create memvault-ci-data >/dev/null

      - name: Verify all binaries present
        run: |
          set -euo pipefail
          for bin in memvault-cli memvault-mcp memvault-proxy; do
            docker run --rm --entrypoint sh memvault:ci -c \
              "[ -x /usr/local/bin/$bin ]" \
              || { echo "missing /usr/local/bin/$bin"; exit 1; }
          done
          docker run --rm memvault:ci memvault-proxy --help >/dev/null

      - name: Smoke CLI (persist to volume)
        run: |
          set -euo pipefail
          img=memvault:ci

          docker run --rm -v memvault-ci-data:/home/memvault/.memvault "$img" \
            memvault-cli --help
          docker run --rm -v memvault-ci-data:/home/memvault/.memvault "$img" \
            memvault-cli save --content "ci docker smoke" \
            --priority MUST --type preference --agent-id ci
          out=$(docker run --rm -v memvault-ci-data:/home/memvault/.memvault "$img" \
            memvault-cli list --limit 10)
          echo "$out" | grep -qi "ci docker smoke"

      - name: Smoke 2 — MCP stdio (initialize round-trip)
        run: |
          set -euo pipefail
          req='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'
          resp=$(printf '%s\n' "$req" | timeout 20 docker run --rm -i \
            -v memvault-ci-data:/home/memvault/.memvault \
            memvault:ci memvault-mcp --db /home/memvault/.memvault/data.db)
          echo "$resp" | grep -q '"id":1'
          echo "$resp" | grep -qi 'MemVault'

      - name: Smoke 3 — REST /health + /metrics + save + search
        run: |
          set -euo pipefail
          docker run -d --name memvault-ci-rest --network host \
            -v memvault-ci-data:/home/memvault/.memvault \
            memvault:ci memvault-mcp --db /home/memvault/.memvault/data.db \
            --transport http --port 18099
          trap 'docker rm -f memvault-ci-rest >/dev/null 2>&1 || true' EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18099/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || {
            echo "REST health never became ready"
            echo "--- container status ---"
            docker ps -a --filter name=memvault-ci-rest --no-trunc
            echo "--- container logs ---"
            docker logs memvault-ci-rest 2>&1 | tail -40 || true
            exit 1
          }
          dump_rest() {
            echo "--- container status ---"
            docker ps -a --filter name=memvault-ci-rest --no-trunc
            echo "--- container logs ---"
            docker logs memvault-ci-rest 2>&1 | tail -40 || true
          }

          # counter is only exported after its first increment, so save first.
          # Content embeds GITHUB_RUN_ID: a repeat run must not hit merge-dedup
          # against the CLI smoke memory ("merged" never increments saved_total).
          save_out=$(curl -sS -f -X POST http://127.0.0.1:18099/api/memories \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"ci docker rest smoke ${GITHUB_RUN_ID:-0}\",\"priority\":\"MUST\",\"agent_id\":\"ci\"}" 2>&1) || {
            echo "save request failed: $save_out"; dump_rest; exit 1
          }
          echo "save response: $save_out"
          echo "$save_out" | grep -q '"ok":true' && echo "$save_out" | grep -q '"action":"saved"' || {
            echo "save was not a fresh save (merged/deduped?): $save_out"; dump_rest; exit 1
          }
          search_out=$(curl -sS -f -X POST http://127.0.0.1:18099/api/search \
            -H "Content-Type: application/json" -d '{"query":"docker smoke"}' 2>&1) || {
            echo "search request failed: $search_out"; dump_rest; exit 1
          }
          echo "search response: $search_out"
          echo "$search_out" | grep -q '"ok":true' || {
            echo "search response missing ok:true"; dump_rest; exit 1
          }
          metrics_out=$(curl -sS http://127.0.0.1:18099/metrics 2>&1) || {
            echo "metrics request failed: $metrics_out"; dump_rest; exit 1
          }
          echo "$metrics_out" | grep -q '^memvault_memories_saved_total' || {
            echo "metrics missing counter:"; echo "$metrics_out" | head -5; dump_rest; exit 1
          }

      - name: Smoke 4 — Web dashboard static serving (--serve-web)
        run: |
          set -euo pipefail
          mkdir -p /tmp/srv
          printf '%s' '<!doctype html><html><body><h1>memvault-ok</h1></body></html>' > /tmp/srv/index.html
          docker run -d --name memvault-ci-web --network host \
            -v memvault-ci-data:/home/memvault/.memvault \
            -v /tmp/srv:/srv/dashboard:ro \
            memvault:ci memvault-mcp --db /home/memvault/.memvault/data.db \
            --transport http --port 18099 --serve-web /srv/dashboard
          trap 'docker rm -f memvault-ci-web >/dev/null 2>&1 || true' EXIT

          dump_web() {
            echo "--- container status ---"
            docker ps -a --filter name=memvault-ci-web --no-trunc
            echo "--- container logs ---"
            docker logs memvault-ci-web 2>&1 | tail -40 || true
          }

          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18099/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || {
            echo "web server never became ready"; dump_web; exit 1
          }

          # SPA fallback: unknown path serves index.html
          web_out=$(curl -sS http://127.0.0.1:18099/dashboard/any-route 2>&1) || {
            echo "dashboard request failed: $web_out"; dump_web; exit 1
          }
          echo "$web_out" | grep -q 'memvault-ok' || {
            echo "dashboard response missing memvault-ok: $web_out"; dump_web; exit 1
          }

  agent-plugins:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: |
          sh -n plugins/memvault/hooks/lib.sh
          sh -n plugins/memvault/hooks/session-start.sh
          sh -n plugins/memvault/hooks/session-extract.sh
          sh -n plugins/memvault/hooks/qoder-prompt.sh
          sh -n plugins/memvault/tests/run-tests.sh
          sh -n scripts/gen-rule-copies.sh
          sh -n scripts/check-rule-parity.sh
      - name: Plugin manifest lint
        run: |
          python3 - <<'PY'
          import json
          for rel in (".claude-plugin/marketplace.json",
                      "plugins/memvault/.claude-plugin/plugin.json",
                      "plugins/memvault/hooks/hooks.json",
                      "gemini-extension.json"):
              json.load(open(rel, encoding="utf-8"))
          for rel in __import__("glob").glob("integrations/mcp-clients/*.json"):
              json.load(open(rel, encoding="utf-8"))
          print("manifests ok")
          PY
      - name: Hook self-tests
        run: sh plugins/memvault/tests/run-tests.sh
      - name: Rule-copy parity
        run: sh scripts/check-rule-parity.sh
      - name: OpenCode plugin syntax
        run: node --check integrations/opencode/plugins/memvault.mjs
      - name: shellcheck (advisory)
        continue-on-error: true
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck plugins/memvault/hooks/*.sh plugins/memvault/tests/run-tests.sh scripts/check-rule-parity.sh scripts/gen-rule-copies.sh
          else
            echo "shellcheck not installed; skipped"
          fi
