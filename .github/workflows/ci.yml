name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust-core:
    name: Rust core (test, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features -- --nocapture

  integration-smoke:
    name: REST API smoke test (built binary)
    runs-on: ubuntu-latest
    needs: rust-core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release -p memvault-mcp -p memvault-cli
      - name: Start memvault-mcp (REST transport)
        run: |
          ./target/release/memvault-mcp --db /tmp/ci-smoke.db --transport http --port 18099 &
          echo $! > /tmp/mcp.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:18099/health && break
            sleep 0.5
          done
      - name: Exercise core REST endpoints
        run: |
          set -euo pipefail
          echo "-- save --"
          save_out=$(curl -sf -X POST http://127.0.0.1:18099/api/memories \
            -H "Content-Type: application/json" \
            -d '{"content":"ci smoke test memory","priority":"MUST","agent_id":"ci"}')
          echo "$save_out"
          echo "$save_out" | grep -q '"ok":true'

          echo "-- search --"
          curl -sf -X POST http://127.0.0.1:18099/api/search \
            -H "Content-Type: application/json" \
            -d '{"query":"smoke test"}' | grep -q '"ok":true'

          echo "-- session start --"
          curl -sf -X POST http://127.0.0.1:18099/api/session \
            -H "Content-Type: application/json" \
            -d '{"agent_id":"ci"}' | grep -q '"ok":true'

          echo "-- promote --"
          curl -sf -X POST http://127.0.0.1:18099/api/promote \
            -H "Content-Type: application/json" -d '{}' | grep -q '"ok":true'

          echo "-- metrics --"
          curl -sf http://127.0.0.1:18099/metrics | grep -q memvault_memories_saved_total

          echo "-- update memory (PUT) --"
          mem_id=$(echo "$save_out" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['id'])")
          curl -sf -X PUT http://127.0.0.1:18099/api/memories/$mem_id \
            -H "Content-Type: application/json" \
            -d '{"instruction":"ci updated instruction","priority":"MUST"}' | grep -q '"ok":true'
          echo "-- PUT with invalid priority rejected (400) --"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:18099/api/memories/$mem_id \
            -H "Content-Type: application/json" -d '{"priority":"MUSTT"}')
          [ "$code" = "400" ] || { echo "expected 400, got $code"; exit 1; }

          echo "-- inbox --"
          curl -sf http://127.0.0.1:18099/api/inbox | grep -q '"ok":true'

          echo "-- compliance --"
          curl -sf http://127.0.0.1:18099/api/compliance/summary | grep -q '"ok":true'

          echo "-- dedup --"
          curl -sf -X POST http://127.0.0.1:18099/api/dedup -H "Content-Type: application/json" -d '{}' | grep -q '"ok":true'

          echo "-- decay --"
          curl -sf -X POST http://127.0.0.1:18099/api/decay -H "Content-Type: application/json" -d '{}' | grep -q '"ok":true'
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/mcp.pid)" 2>/dev/null || true

  dashboard:
    name: Dashboard (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm ci
        working-directory: dashboard
        run: npm ci
      - name: Frontend build (tsc + vite build)
        working-directory: dashboard
        run: npm run build
      - name: Frontend tests
        working-directory: dashboard
        run: npm test

  vscode-extension:
    name: VS Code extension (compile, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm ci
        working-directory: vscode-extension
        run: npm ci
      - name: Compile
        working-directory: vscode-extension
        run: npm run compile
      - name: Test
        working-directory: vscode-extension
        run: npm test
      - name: Package validation (vsce package, discarded)
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce package --no-dependencies -o /tmp/memvault.vsix

  obsidian-plugin:
    name: Obsidian plugin (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm ci
        working-directory: obsidian-plugin
        run: npm ci
      - name: Build
        working-directory: obsidian-plugin
        run: npm run build
      - name: Test
        working-directory: obsidian-plugin
        run: npm test