name: Publish (manual — fallback)

# crates.io and npm publish via OIDC trusted publishing — no token secrets:
#   - crates.io: configure Trusted Publishing on each crate
#     (crate Settings -> Trusted Publishing: owner=dreamor repo=memvault
#     workflow=release.yml AND workflow=publish.yml).
#   - npm: configure trusted publisher on the package (npmjs.com ->
#     package Settings -> Trusted Publishing, workflow=release.yml).
#     Requires npm >= 11.5.1, hence Node 24.
#
# Trigger: Actions -> "Publish (manual — fallback)" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (informational only, for manual runs)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  crates-io:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC exchange for crates.io trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate via trusted publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish core first, then consumers
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          # memvault-cli/mcp/proxy resolve memvault-core via the crates.io
          # index rather than the local path once packaged; a freshly
          # published crate can take a short while to propagate there.
          # Publishing straight through without retry can hard-fail the
          # dependents with "no matching package named `memvault-core`
          # found" (reproduced locally via `cargo publish --dry-run`) —
          # retry instead of a single attempt per crate.
          publish_with_retry() {
            local crate="$1" attempt=1 max_attempts=10
            until cargo publish -p "$crate" --allow-dirty --no-verify; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "cargo publish $crate failed after $max_attempts attempts" >&2
                exit 1
              fi
              echo "cargo publish $crate failed (attempt $attempt/$max_attempts) — retrying in 15s, likely index propagation lag"
              attempt=$((attempt + 1))
              sleep 15
            done
          }

          for crate in memvault-core memvault-cli memvault-mcp memvault-proxy; do
            echo "==> cargo publish $crate"
            publish_with_retry "$crate"
          done

  npm-dsh:
    name: Publish dsh plugin to npm (trusted publishing)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm >= 11.5.1 required for OIDC trusted publishing
          registry-url: https://registry.npmjs.org
      - name: npm ci
        working-directory: dsh-plugin
        run: npm ci
      - name: Build
        working-directory: dsh-plugin
        run: npm run build
      - name: Test
        working-directory: dsh-plugin
        run: npm test
      - name: Publish
        working-directory: dsh-plugin
        run: npm publish --access public

  # Plugin surfaces (Claude marketplace, Qoder/Grok manifests, rule copies)
  # ride on the repo itself — verify them at release time so a tag never
  # ships a broken marketplace source or drifted rule copies.
  plugin-release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plugin manifests + hooks + parity
        run: |
          python3 - <<'PY'
          import json
          for rel in (".claude-plugin/marketplace.json",
                      "plugins/memvault/.claude-plugin/plugin.json",
                      "plugins/memvault/hooks/hooks.json",
                      "gemini-extension.json",
                      "plugin.json",
                      ".qoder-plugin/plugin.json",
                      ".grok-plugin/marketplace.json",
                      "integrations/mcp-registry/server.json"):
              json.load(open(rel, encoding="utf-8"))
          print("release manifests ok")
          PY
          sh plugins/memvault/tests/run-tests.sh
          sh scripts/check-rule-parity.sh
