# Dependabot configuration
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
# Schedule: weekly on Monday 09:00 UTC (SAST 17:00) — catch CVEs early, avoid weekend surprise PRs.
version: 2

updates:
  # Cargo workspace dependency tracking
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    # Wait until rust-stable has had time to update before pulling new deps
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 8
    # Group minor/patch updates so we don't drown in PRs
    groups:
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      rust-major:
        patterns:
          - "*"
        update-types:
          - "major"
    # Don't touch the workspace primitives unless explicitly requested
    ignore:
      - dependency-name: "rust-version"
      - dependency-name: "edition"

  # GitHub Actions workflow pinning
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Tauri Dashboard (pinned to pnpm for reproducible installs)
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "dashboard"
    open-pull-requests-limit: 5
    groups:
      dashboard-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # VS Code extension
  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "vscode"
    open-pull-requests-limit: 5

  # Obsidian plugin
  - package-ecosystem: "npm"
    directory: "/obsidian-plugin"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "obsidian"
    open-pull-requests-limit: 5