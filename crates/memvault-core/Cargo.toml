[package]
name = "memvault-core"
description = "MemVault core engine: storage, retrieval, and memory router"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true
rusqlite.workspace = true
r2d2 = "0.8"
r2d2_sqlite = "0.35"
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
subtle = "2"
regex = "1"
# 内嵌本地 embedding 推理(零外部服务;ONNX Runtime 由 fastembed 管理)
fastembed = { version = "6", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports", "async_futures", "async_tokio"] }

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "session_start_bench"
harness = false

[[bench]]
name = "trace_recall_cost"
harness = false
