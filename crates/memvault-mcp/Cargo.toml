[package]
name = "memvault-mcp"
description = "MemVault MCP server: exposes memory tools and resources via MCP protocol"
version.workspace = true
edition.workspace = true

[dependencies]
memvault-core = { path = "../memvault-core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
chrono.workspace = true
rmcp = { version = "3.1.1", features = ["server", "transport-io", "server-side-http", "transport-streamable-http-server"] }
schemars = "1.2"
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "fs"] }
uuid.workspace = true
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

[dev-dependencies]
reqwest.workspace = true
