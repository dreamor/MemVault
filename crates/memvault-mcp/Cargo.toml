[package]
name = "memvault-mcp"
description = "MemVault MCP server: exposes memory tools and resources via MCP protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
memvault-core = { path = "../memvault-core", version = "0.4.0" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
chrono.workspace = true
rmcp = { version = "3.1.1", features = ["server", "transport-io", "server-side-http", "transport-streamable-http-server"] }
schemars = "1.2"
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "fs"] }
uuid.workspace = true
# Bakes the Web Dashboard (assets/web, synced from dashboard/dist) into the
# binary so cargo install / brew / release archives ship the UI by default.
rust-embed = "8"
mime_guess = "2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[dev-dependencies]
reqwest.workspace = true
async-trait.workspace = true
# Enables the rmcp client side (streamable HTTP over reqwest) in tests so the
# ServerHandler base surface (list_resources/read_resource/…) can be exercised
# through a real client connection.
rmcp = { version = "3.1.1", features = ["client", "transport-streamable-http-client-reqwest"] }
